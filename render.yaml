services:
  - type: web
    name: expensio-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "http://localhost:5173,https://*.vercel.app"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
